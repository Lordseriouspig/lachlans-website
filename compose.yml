services:
  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    expose:
      - "4000"
    networks:
      lordseriouspigs-website-net:

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      lordseriouspigs-website-net:
        ipv4_address: 172.20.0.10
networks:
  lordseriouspigs-website-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
