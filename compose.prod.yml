name: lachlans-website

services:
  backend:
    image: ghcr.io/lordseriouspig/lachlans-website-backend:production
    platform: linux/arm64
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      HACKATIME_USERNAME: ${HACKATIME_USERNAME:-}
      HACKATIME_URL: ${HACKATIME_URL:-https://hackatime.hackclub.com}
      HACKATIME_STATS_API_KEY: ${HACKATIME_STATS_API_KEY:-}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - application
    labels:
      com.lordseriouspig.application: lachlans-website
      com.lordseriouspig.component: backend

  frontend:
    image: ghcr.io/lordseriouspig/lachlans-website-frontend:production
    platform: linux/arm64
    pull_policy: always
    restart: unless-stopped
    init: true
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - application
    labels:
      com.lordseriouspig.application: lachlans-website
      com.lordseriouspig.component: frontend

  cloudflared:
    image: cloudflare/cloudflared:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    command: ["tunnel", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env}
    expose:
      - "2000"
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - application
    labels:
      com.lordseriouspig.application: lachlans-website
      com.lordseriouspig.component: cloudflared

  alloy:
    image: ghcr.io/lordseriouspig/lachlans-website-alloy:production
    platform: linux/arm64
    pull_policy: always
    restart: unless-stopped
    init: true
    working_dir: /app
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - exec 3<>/dev/tcp/127.0.0.1/12345; printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3; IFS= read -r status <&3; [[ "$$status" == *" 200 "* ]]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      ALLOY_LOKI_URL: ${ALLOY_LOKI_URL:?Set ALLOY_LOKI_URL in .env}
      ALLOY_PROM_URL: ${ALLOY_PROM_URL:?Set ALLOY_PROM_URL in .env}
      ALLOY_TEMPO_URL: ${ALLOY_TEMPO_URL:?Set ALLOY_TEMPO_URL in .env}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in .env}
    volumes:
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    networks:
      - application
    labels:
      com.lordseriouspig.application: lachlans-website
      com.lordseriouspig.component: alloy

networks:
  application:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  alloy_data:
