name: Build and publish website images

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lachlans-website-production-build
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-arm64:
    name: Build ARM64 images
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 images
        env:
          OWNER: ${{ github.repository_owner }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          OWNER="${OWNER,,}"

          build_image() {
            local image="$1"
            local dockerfile="$2"
            local context="$3"

            docker buildx build \
              --platform linux/arm64 \
              --pull \
              --push \
              --tag "ghcr.io/${OWNER}/lachlans-website-${image}:arm64-${GIT_SHA}" \
              --file "$dockerfile" \
              "$context"
          }

          build_image backend backend/Dockerfile backend
          build_image frontend frontend/Dockerfile frontend
          build_image alloy alloy/Dockerfile alloy
          build_image tor tor/Dockerfile tor

  build-amd64:
    name: Build AMD64 images
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD64 images
        env:
          OWNER: ${{ github.repository_owner }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          OWNER="${OWNER,,}"

          build_image() {
            local image="$1"
            local dockerfile="$2"
            local context="$3"

            docker buildx build \
              --platform linux/amd64 \
              --pull \
              --push \
              --tag "ghcr.io/${OWNER}/lachlans-website-${image}:amd64-${GIT_SHA}" \
              --file "$dockerfile" \
              "$context"
          }

          build_image backend backend/Dockerfile backend
          build_image frontend frontend/Dockerfile frontend
          build_image alloy alloy/Dockerfile alloy
          build_image tor tor/Dockerfile tor

  publish-manifests:
    name: Publish multi-platform manifests
    runs-on: ubuntu-24.04
    needs:
      - build-arm64
      - build-amd64
    timeout-minutes: 30

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform manifests
        env:
          OWNER: ${{ github.repository_owner }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          OWNER="${OWNER,,}"

          publish_image() {
            local image="$1"
            local base="ghcr.io/${OWNER}/lachlans-website-${image}"

            docker buildx imagetools create \
              --tag "${base}:production" \
              --tag "${base}:sha-${GIT_SHA}" \
              "${base}:arm64-${GIT_SHA}" \
              "${base}:amd64-${GIT_SHA}"
          }

          publish_image backend
          publish_image frontend
          publish_image alloy
          publish_image tor
