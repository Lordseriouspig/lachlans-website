name: Build and publish TUI images

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tui-production-build
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build and publish native ARM64 images
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Expose GitHub Actions runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Generate build metadata
        run: |
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_ENV=production" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_NAME=tui" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_REGION=australia" >> "$GITHUB_ENV"
          echo "GIT_COMMIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "GIT_BRANCH=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Build and push native ARM64 application images
        env:
          OWNER: ${{ github.repository_owner }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          OWNER="${OWNER,,}"

          build_image() {
            local image="$1"
            local dockerfile="$2"
            local context="$3"
            docker buildx build \
              --platform linux/arm64 \
              --pull \
              --push \
              --tag "ghcr.io/${OWNER}/lordseriouspigs-website-${image}:production" \
              --tag "ghcr.io/${OWNER}/lordseriouspigs-website-${image}:sha-${GIT_SHA}" \
              --file "$dockerfile" \
              "$context"
          }

          build_image backend backend/Dockerfile backend
          build_image frontend frontend/Dockerfile .
